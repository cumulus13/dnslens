[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "dnslens"
version = "1.0.4"
description = "Cross-platform DNS toolkit for developers and DevOps: query, trace, propagation, audit, DNSSEC, local DNS server with an AdGuard Home style web UI, and an HTTP/Prometheus API."
readme = "README.md"
requires-python = ">=3.9"
license-files = [
    "LICENSE",
]
authors = [
    { name = "Hadi Cahyadi", email = "cumulus13@gmail.com" },
]
keywords = [
    "dns",
    "dns-server",
    "adguard",
    "ad-blocker",
    "web-ui",
    "dashboard",
    "prometheus",
    "blocklist",
    "devops",
    "dig",
    "dnssec",
    "propagation",
    "cli",
    "networking",
    "sre",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "dnspython[dnssec]>=2.6",
]

[project.optional-dependencies]
doh = [
    "dnspython[doh]>=2.6",
]
sql = [
    "sqlalchemy>=2.0",
]
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
mysql = [
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
]
dev = [
    "pytest>=7",
    "ruff>=0.5",
    "mypy>=1.8",
    "build",
    "twine",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
]

[project.urls]
Homepage = "https://github.com/cumulus13/dnslens"
Issues = "https://github.com/cumulus13/dnslens/issues"
Changelog = "https://github.com/cumulus13/dnslens/blob/master/CHANGELOG.md"

[project.scripts]
dnslens = "dnslens.cli:main"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.setuptools.package-data]
dnslens = [
    "py.typed",
    "webui/*",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "tests",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]
ignore = [
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    "E501",
    "B008",
    "E731",
]

[tool.mypy]
ignore_missing_imports = true
