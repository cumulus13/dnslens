name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: dnslens --version

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*

  ui:
    name: web UI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: npm install --no-audit --no-fund
        working-directory: tests/ui
      - run: bash tests/ui/run.sh

  database:
    name: database backends (PostgreSQL, MariaDB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dnslens
          POSTGRES_PASSWORD: dnslens-pw
          POSTGRES_DB: dnslens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dnslens" --health-interval 5s --health-timeout 5s --health-retries 12
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root-pw
          MARIADB_USER: dnslens
          MARIADB_PASSWORD: dnslens-pw
          MARIADB_DATABASE: dnslens
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DNSLENS_TEST_PG: postgresql+psycopg://dnslens:dnslens-pw@127.0.0.1:5432/dnslens
      DNSLENS_TEST_MYSQL: mysql+pymysql://dnslens:dnslens-pw@127.0.0.1:3306/dnslens?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_sql.py tests/test_live.py -q

